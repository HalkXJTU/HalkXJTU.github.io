<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f3f3e9">
  <title>Welcome · Academic homepage</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="gate-ui.css?v=field-3">
  <script src="gate-ui.js?v=field-3" defer></script>
  <script src="vault.js?v=3" defer></script>
</head>
<body class="gate" data-pose="idle">
  <div class="gate-layout">
    <aside class="gate-studio" aria-labelledby="studio-name">
      <div class="gate-brand" id="studio-name" data-gate-text="studio">Hao Jing’s personal homepage</div>
      <svg class="terrain-lines" aria-hidden="true" focusable="false" viewBox="0 0 680 800" preserveAspectRatio="xMidYMid slice">
        <defs><path id="contour" d="M-200 260c150 78 205 10 265-60s132-98 216-93c113 6 93-77 217-94s149-56 240-55"/></defs>
        <g fill="none" stroke="currentColor">
          <use href="#contour"/><use href="#contour" transform="translate(0 14)"/><use href="#contour" transform="translate(1 30)"/>
          <use href="#contour" transform="translate(5 47)"/><use href="#contour" transform="translate(11 66)"/>
        </g>
        <g fill="none" stroke="currentColor" transform="translate(700 860) rotate(180)">
          <use href="#contour"/><use href="#contour" transform="translate(2 16)"/><use href="#contour" transform="translate(7 35)"/><use href="#contour" transform="translate(14 55)"/>
        </g>
      </svg>
      <div class="gate-art" aria-hidden="true">
        <svg class="gate-ensemble" viewBox="0 0 550 434" width="550" height="434" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="tower-tone" x2="0.85" y2="1"><stop stop-color="#598f80"/><stop offset="1" stop-color="#37766b"/></linearGradient>
            <linearGradient id="slab-tone" x2="0.8" y2="1"><stop stop-color="#a4bab0"/><stop offset="1" stop-color="#87a49a"/></linearGradient>
            <linearGradient id="dome-tone" x2="0.7" y2="1"><stop stop-color="#dfa483"/><stop offset="1" stop-color="#c98467"/></linearGradient>
            <linearGradient id="arch-tone" x2="0.7" y2="1"><stop stop-color="#efddb2"/><stop offset="1" stop-color="#dcc893"/></linearGradient>
          </defs>
          <ellipse cx="273" cy="409" rx="229" ry="6" fill="#526458" opacity=".09"/>
          <g class="ensemble-footing" fill="none" stroke="currentColor">
            <path d="M14 405h522M20 397v16m510-16v16" />
          </g>
          <g class="ensemble-figure ensemble-tower">
            <path fill="url(#tower-tone)" d="M103 405V37q0-8 8-8h165q8 0 8 8v368Z"/>
            <path fill="#306c61" d="M267 29h9q8 0 8 8v368h-17Z"/>
            <path class="ensemble-seam" d="M104 74h162"/>
            <g class="ensemble-face">
              <g data-eye="7" transform="translate(151 88)"><g class="ensemble-blink"><circle r="13" fill="#fffdf4"/><circle data-pupil="" r="5"/></g></g>
              <g data-eye="7" transform="translate(200 88)"><g class="ensemble-blink"><circle r="13" fill="#fffdf4"/><circle data-pupil="" r="5"/></g></g>
            </g>
          </g>
          <g class="ensemble-figure ensemble-slab">
            <path fill="url(#slab-tone)" d="M260 405V139q0-7 7-7h102q7 0 7 7v266Z"/>
            <path fill="#7f9b90" d="M364 132h5q7 0 7 7v266h-12Z"/>
            <g class="ensemble-face">
              <g data-eye="6" transform="translate(283 164)"><g class="ensemble-blink"><circle r="11.5" fill="#fffdf4"/><circle data-pupil="" r="4.5"/></g></g>
              <g data-eye="6" transform="translate(319 164)"><g class="ensemble-blink"><circle r="11.5" fill="#fffdf4"/><circle data-pupil="" r="4.5"/></g></g>
            </g>
          </g>
          <g class="ensemble-figure ensemble-dome">
            <path fill="url(#dome-tone)" d="M42 405v-67a111 111 0 0 1 222 0v67Z"/>
            <g class="ensemble-face">
              <g data-eye="6" transform="translate(124 310)"><g class="ensemble-blink"><circle r="11.5" fill="#fffdf4"/><circle data-pupil="" r="4.6"/></g></g>
              <g data-eye="6" transform="translate(166 310)"><g class="ensemble-blink"><circle r="11.5" fill="#fffdf4"/><circle data-pupil="" r="4.6"/></g></g>
            </g>
          </g>
          <g class="ensemble-figure ensemble-arch">
            <path fill="url(#arch-tone)" d="M352 405V259a71 71 0 0 1 142 0v146Z"/>
            <g class="ensemble-face">
              <g data-eye="6" transform="translate(389 231)"><g class="ensemble-blink"><circle r="11.5" fill="#fffdf4"/><circle data-pupil="" r="4.6"/></g></g>
              <g data-eye="6" transform="translate(422 231)"><g class="ensemble-blink"><circle r="11.5" fill="#fffdf4"/><circle data-pupil="" r="4.6"/></g></g>
              <path class="ensemble-mouth" d="M383 274h63" fill="none" stroke="currentColor" stroke-width="4.7" stroke-linecap="round"/>
            </g>
          </g>
        </svg>
      </div>
    </aside>
    <main class="gate-main">
      <div class="gate-languages" role="group" aria-label="Language">
        <button type="button" data-gate-lang="zh" lang="zh-CN" aria-label="中文" aria-pressed="false">中</button>
        <button type="button" data-gate-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        <button type="button" data-gate-lang="it" lang="it" aria-label="Italiano" aria-pressed="false">IT</button>
      </div>
      <div class="gate-panel">
        <h1 data-gate-text="heading">Welcome</h1>
        <p class="gate-intro" data-gate-text="intro">Use the invitation code from your email to visit my academic homepage.</p>
        <form id="gate-form" novalidate>
          <label for="gate-password" data-gate-text="label">Invitation code</label>
          <div class="gate-input-wrap">
            <input type="password" id="gate-password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="gate-message">
            <button type="button" id="gate-reveal" aria-label="Show code" aria-controls="gate-password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <path d="M2 12s3.7-6.4 10-6.4S22 12 22 12s-3.7 6.4-10 6.4S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/><path class="gate-eye-slash" d="m3.5 3.2 17 17.6"/>
              </svg>
            </button>
          </div>
          <p id="gate-message" class="gate-message" role="status" aria-live="polite" aria-atomic="true"></p>
          <button class="gate-submit" id="gate-submit" type="submit" disabled>
            <span id="gate-submit-label">Enter homepage</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </button>
          <noscript><p class="gate-nojs"><span lang="zh-CN">请启用 JavaScript 后输入邀请码。</span><br><span lang="en">Enable JavaScript to enter your invitation code.</span><br><span lang="it">Attiva JavaScript per inserire il codice di invito.</span></p></noscript>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
